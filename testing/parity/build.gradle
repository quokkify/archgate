plugins {
    id 'archgate.java-conventions'
}

evaluationDependsOn(':maven-plugin')
evaluationDependsOn(':gradle-plugin')

def gradlePlugin = project(':gradle-plugin')
def pluginMetadata = gradlePlugin.tasks.named('pluginUnderTestMetadata')

dependencies {
    testImplementation project(':testing:fixtures-support')
    testImplementation libs.maven.verifier
    testRuntimeOnly libs.maven.core
    testImplementation gradleTestKit()
    testRuntimeOnly files(pluginMetadata.map { it.outputDirectory }) {
        builtBy pluginMetadata
    }
}

tasks.named('test', Test) {
    description = 'Runs every shared fixture through Maven and Gradle and compares the results.'
    FixtureTests.configure(delegate, project, true)
}
