plugins {
    id 'archgate.java-conventions'
}

dependencies {
    implementation libs.maven.verifier
    implementation gradleTestKit()
    testRuntimeOnly libs.maven.core
}

tasks.named('test', Test) {
    systemProperty 'archgate.fixtures', rootProject.file('fixtures').absolutePath
    systemProperty 'archgate.root', rootProject.projectDir.absolutePath
    def bomPom = project(':bom').layout.buildDirectory.file('publications/maven/pom-default.xml')
    dependsOn ':bom:generatePomFileForMavenPublication'
    inputs.file(bomPom).withPropertyName('bomPom')
    systemProperty 'archgate.bomPom', bomPom.get().asFile.absolutePath
    inputs.files(rootProject.fileTree(rootProject.projectDir) {
        include 'README*.md', 'AGENTS.md', 'docs/**/*.md', 'rules-*/src/main/java/**/*.java'
    }).withPropertyName('docs').withPathSensitivity(PathSensitivity.RELATIVE)
}
