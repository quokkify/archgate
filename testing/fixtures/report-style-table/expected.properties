runs=3
# 1: the table style summarizes the rules in aligned columns, details follow under the rule name
run.1.args=-Darchgate.reportStyle=table
run.1.outcome=failure
run.1.matches.1=RULE\\s+SCOPE\\s+SEVERITY\\s+RESULT\\s+FOUND\\s+BUILD\\s+TIME
run.1.matches.2=No java\\.util\\.Date\\s+MAIN\\+TEST\\s+WARNING\\s+violated\\s+-\\s+fails\\s+\\d+ ms
run.1.contains.1=Gate FAILED: 1 rule, 1 warning
run.1.absent.1=ms  No java.util.Date
# 2: classic stays the default
run.2.outcome=failure
run.2.contains.1=ms  No java.util.Date
run.2.absent.1=SEVERITY
# 3: the reserved style fails before any rule runs
run.3.args=-Darchgate.reportStyle=detailed
run.3.outcome=failure
run.3.unableToVerify=true
run.3.contains.1=reportStyle 'detailed' is not available yet. Use classic or table.
