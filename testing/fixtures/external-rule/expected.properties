runs=7
# 1: no token outside CI skips the rule
run.1.systemProperties=archgate.ci=false
run.1.outcome=success
run.1.contains.1=[SKIP]
run.1.contains.2=Missing TRACKER_TOKEN. Pass them as -DNAME=value or as environment variables.
run.1.contains.3=Skipped because this is not a CI run (archgate.ci=false); in CI this fails the build.
run.1.contains.4=, 1 skipped
# 2: the token is present, the rule passes
run.2.systemProperties=archgate.ci=false TRACKER_TOKEN=x
run.2.outcome=success
run.2.matches.1=\\[PASS\\]\\s.*Tracker token
run.2.absent.1=[SKIP]
# 3: offline switches the rule off outside CI
run.3.systemProperties=archgate.ci=false archgate.offline=true TRACKER_TOKEN=x
run.3.outcome=success
run.3.contains.1=[SKIP]
run.3.contains.2=External rules are switched off by archgate.offline=true.
# 4: the missing token fails a CI run
run.4.systemProperties=archgate.ci=true
run.4.outcome=failure
run.4.unableToVerify=true
run.4.contains.1=cannot run in CI (archgate.ci=true)
# 5: offline is ignored in CI, so the rules run
run.5.systemProperties=archgate.ci=true archgate.offline=true TRACKER_TOKEN=x
run.5.outcome=success
# the warning goes to the build log, not the report, so it is matched against the log
run.5.matches.1=archgate\\.offline=true is ignored in CI \\(archgate\\.ci=true\\); external rules run\\.
run.5.matches.2=\\[PASS\\]\\s.*Tracker token
# 6: an optional variable reaches the rule
run.6.systemProperties=archgate.ci=false archgate.changedFiles=changed.txt
run.6.outcome=success
run.6.contains.1=changed files: changed.txt
run.6.matches.1=\\[INFO\\]\\s.*Changed files
# 7: an unknown value fails closed
run.7.systemProperties=archgate.ci=false archgate.ci.serviceUnavailable=maybe
run.7.outcome=failure
run.7.unableToVerify=true
run.7.contains.1=Unknown archgate.ci.serviceUnavailable value 'maybe'. Use fail or skip.
