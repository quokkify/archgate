runs=2
# 1: a table group prints a header row and aligned columns; an empty line separates it from the flat group
run.1.outcome=failure
run.1.contains.1=Violations (1) "case is deleted":
run.1.contains.2=- C7  LoginTest.java:12
run.1.contains.3=Violations (2) "case is in another stage":
run.1.matches.1=CASE  ACTUAL      LOCATION
run.1.matches.2=----  ----------  --------------------
run.1.matches.3=C101  staging     CheckoutTest\\.java:40
run.1.matches.4=C2    production  CartTest\\.java:7
run.1.matches.5=LoginTest\\.java:12\\R\\R {4}Violations \\(2\\)
run.1.contains.4=Gate FAILED: 1 rule, 1 error
# 2: the table style counts the violations of every group in FOUND
run.2.args=-Darchgate.reportStyle=table
run.2.outcome=failure
run.2.matches.1=Case links\\s+MAIN\\+TEST\\s+ERROR\\s+violated\\s+3\\s+fails\\s+\\d+ ms
