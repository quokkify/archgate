runs=1
run.1.systemProperties=archgate.ci=false
run.1.outcome=failure
run.1.contains.1=Violations (2) "case is deleted":
run.1.contains.2=Violations (1) "case has no title":
run.1.contains.3=Shared: issue index
run.1.contains.4=Gate FAILED: 2 rules, 1 error
run.1.absent.1=case is archived
# the report goes to the log and to report.txt; the log holds it once, so exactly one Shared line proves one build
run.1.matches.1=(?s)\\A(?:(?!Shared: issue index).)*Shared: issue index(?:(?!Shared: issue index).)*\\z
run.1.matches.2=\\[PASS\\]\\s.*Issue index reader
run.1.matches.3=\\[ERROR\\]\\s.*Deleted issues
