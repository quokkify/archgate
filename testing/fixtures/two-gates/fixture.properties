# Two gates in one build: app runs a gate of its own with the default module selection, and its rule
# extends a class from helpers, a test dependency of app only; the dedicated gate architecture checks
# app with Service registration.
rootPackage=com.example
modules=helpers,app,architecture
gate=architecture
ownGates=app
dependsOn.architecture=app
testDependsOn.app=helpers
testDependencies=archgate-rules-archunit
