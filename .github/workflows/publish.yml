name: Publish

on:
  workflow_run:
    workflows: [Release Please]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0.
        required: true
        type: string
      plugin-portal-only:
        description: Skip Maven Central, which already has this release, and publish only to the Gradle Plugin Portal.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 90
    steps:
      - name: Validate the requested tag
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s\n' "$REQUESTED_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$REQUESTED_TAG' is not a release tag of the form vX.Y.Z" >&2
            exit 1
          fi
      - name: Check out the release commit
        uses: quokkify/ci-kit/actions/checkout@4fea91ef43792163ae6b4b1775c803009921b3dd # v4.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find the release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! git tag --points-at HEAD | grep -Fxq "$REQUESTED_TAG"; then
              echo "::error::Tag $REQUESTED_TAG does not exist or does not point at the checked-out commit" >&2
              exit 1
            fi
            tag=$REQUESTED_TAG
          elif [ -z "$tag" ]; then
            echo "No release tag points at this commit; nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "v$(cat version.txt)" != "$tag" ]; then
            echo "::error::version.txt ($(cat version.txt)) does not match tag $tag" >&2
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        if: steps.tag.outputs.found == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        if: steps.tag.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the release
        if: steps.tag.outputs.found == 'true'
        run: ./gradlew build -PfixtureTools=gradle -Prelease=true
      - name: Publish to Maven Central and the Gradle Plugin Portal
        if: steps.tag.outputs.found == 'true'
        env:
          PLUGIN_PORTAL_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin-portal-only }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [ "$PLUGIN_PORTAL_ONLY" != "true" ]; then
            ./gradlew publishAndReleaseToMavenCentral -Prelease=true
          fi
          ./gradlew publishPlugins -Prelease=true
