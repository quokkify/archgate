plugins {
    id 'java-gradle-plugin'
    id 'archgate.java-conventions'
    id 'archgate.publish-conventions'
    id 'com.gradle.plugin-publish'
}

description = 'Runs ArchGate architecture checks in a Gradle build.'

sourceSets {
    functionalTest
}

configurations {
    functionalTestImplementation.extendsFrom testImplementation
    functionalTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation project(':core')

    functionalTestImplementation project(':testing:fixtures-support')
    functionalTestImplementation gradleTestKit()
}

gradlePlugin {
    website = 'https://github.com/quokkify/archgate'
    vcsUrl = 'https://github.com/quokkify/archgate'
    testSourceSets(sourceSets.functionalTest)
    plugins {
        archgate {
            id = 'dev.quokkify.archgate'
            implementationClass = 'dev.quokkify.archgate.gradle.ArchgatePlugin'
            displayName = 'ArchGate'
            description = 'Runs ArchGate architecture rules against the classes and sources of a Java project.'
            tags = ['architecture', 'archunit', 'quality']
        }
    }
}

def functionalTest = tasks.register('functionalTest', Test) {
    group = 'verification'
    description = 'Runs the shared fixtures through real Gradle builds with TestKit.'
    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath
    dependsOn rootProject.tasks.named('publishToItRepo')
    inputs.files(rootProject.itRepoArtifacts).withPropertyName('itRepoArtifacts').withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.dir(rootProject.file('fixtures')).withPropertyName('fixtures')
    systemProperty 'archgate.itRepo', rootProject.layout.buildDirectory.dir('it-repo').get().asFile.path
    systemProperty 'archgate.fixtures', rootProject.file('fixtures').path
    systemProperty 'archgate.version', project.version.toString()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

tasks.named('check') {
    dependsOn functionalTest
}
