plugins {
    id 'base'
    alias(libs.plugins.maven.plugin.development) apply false
    alias(libs.plugins.plugin.publish) apply false
}

def baseVersion = file('version.txt').text.trim()
def isRelease = providers.gradleProperty('release').map { it == 'true' }.getOrElse(false)

allprojects {
    group = 'dev.quokkify.archgate'
    version = isRelease ? baseVersion : "${baseVersion}-SNAPSHOT"
}

def itRepoDir = layout.buildDirectory.dir('it-repo')
def itRepoArtifacts = objects.fileCollection()
ext.itRepoArtifacts = itRepoArtifacts
ext.mavenItCache = layout.buildDirectory.dir('maven-it-cache')

def cleanItRepo = tasks.register('cleanItRepo', Delete) {
    description = 'Deletes the integration-test repository, so it holds only the artifacts of this build.'
    delete itRepoDir
}

tasks.register('publishToItRepo') {
    group = 'publishing'
    description = 'Publishes every module to the local integration-test repository.'
}

subprojects {
    def modulePath = path
    plugins.withId('archgate.it-repo') {
        rootProject.tasks.named('publishToItRepo') {
            dependsOn("${modulePath}:publishAllPublicationsToItRepository")
        }
        tasks.withType(PublishToMavenRepository).configureEach { task ->
            if (task.name.endsWith('ToItRepository')) {
                task.dependsOn(cleanItRepo)
                itRepoArtifacts.from(task.inputs.files)
            }
        }
    }
}

def denylistHookTest = tasks.register('denylistHookTest', Exec) {
    group = 'verification'
    description = 'Exercises the blocking paths of scripts/pre-push-denylist.sh.'
    inputs.files('scripts/pre-push-denylist.sh', 'scripts/test-pre-push-denylist.sh')
    commandLine 'sh', 'scripts/test-pre-push-denylist.sh'
}

tasks.named('check') {
    dependsOn denylistHookTest
}
