[versions]
spotless = "8.10.4"
palantirJavaFormat = "2.102.0"
vanniktechPublish = "0.37.0"
checkstyle = "14.3.0"
jacoco = "0.8.15"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
javaparser = "3.28.2"
classgraph = "4.8.199"
querydsl = "5.1.0"
awaitility = "4.3.0"
log4j = "2.26.1"
testng = "7.12.0"
slf4j = "2.0.20"
mavenApi = "3.9.0"
mavenRuntime = "3.9.16"
mavenPluginAnnotations = "3.16.0"
mavenVerifier = "2.0.0"
pluginPublish = "2.2.1"

[libraries]
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
vanniktech-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktechPublish" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
javaparser-core = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
querydsl-core = { module = "com.querydsl:querydsl-core", version.ref = "querydsl" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
testng = { module = "org.testng:testng", version.ref = "testng" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "mavenApi" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "mavenApi" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "mavenPluginAnnotations" }
maven-verifier = { module = "org.apache.maven.shared:maven-verifier", version.ref = "mavenVerifier" }
apache-maven-distribution = { module = "org.apache.maven:apache-maven", version.ref = "mavenRuntime" }

[plugins]
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }
