[versions]
spotless = "8.10.4"
palantirJavaFormat = "2.102.0"
vanniktechPublish = "0.37.0"
checkstyle = "14.3.0"
jacoco = "0.8.15"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
querydsl = "5.1.0"
awaitility = "4.3.0"
log4j = "2.26.1"
testng = "7.12.0"
slf4j = "2.0.20"

[libraries]
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
vanniktech-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktechPublish" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
querydsl-core = { module = "com.querydsl:querydsl-core", version.ref = "querydsl" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
testng = { module = "org.testng:testng", version.ref = "testng" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
