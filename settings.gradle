pluginManagement {
    includeBuild('build-logic')
}

rootProject.name = 'archgate'

def modules = [
    'api'                : 'api',
    'core'               : 'core',
    'context-archunit'   : 'backends/archunit/context',
    'rules-archunit'     : 'backends/archunit/rules',
    'context-javaparser' : 'backends/javaparser/context',
    'rules-javaparser'   : 'backends/javaparser/rules',
    'context-classgraph' : 'backends/classgraph/context',
    'rules-classgraph'   : 'backends/classgraph/rules',
    'maven-plugin'       : 'maven-plugin',
    'gradle-plugin'      : 'gradle-plugin',
    'bom'                : 'bom',
]

modules.each { name, dir ->
    include name
    project(":${name}").projectDir = file(dir)
}

include 'testing'
