plugins {
    id 'com.vanniktech.maven.publish'
}

def releaseBuild = providers.gradleProperty('release').map { it == 'true' }.getOrElse(false)
def hasSigningKey = providers.gradleProperty('signingInMemoryKey').isPresent()
def publishingTaskRequested = gradle.startParameter.taskNames.any { it.contains('MavenCentral') || it.endsWith('publishPlugins') }
if (releaseBuild && publishingTaskRequested && !hasSigningKey) {
    throw new GradleException('A release (-Prelease=true) is published only signed, but the Gradle property signingInMemoryKey is not set. Provide it, for example through ORG_GRADLE_PROJECT_signingInMemoryKey.')
}

mavenPublishing {
    publishToMavenCentral(true, com.vanniktech.maven.publish.DeploymentValidation.PUBLISHED)
    if (hasSigningKey) {
        signAllPublications()
    }
    pom {
        name = base.archivesName
        description = project.description ?: 'ArchGate architecture checks for Java projects'
        url = 'https://github.com/quokkify/archgate'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'quokkify'
                name = 'quokkify'
                url = 'https://github.com/quokkify'
            }
        }
        scm {
            url = 'https://github.com/quokkify/archgate'
            connection = 'scm:git:git://github.com/quokkify/archgate.git'
            developerConnection = 'scm:git:ssh://git@github.com/quokkify/archgate.git'
        }
    }
}

afterEvaluate {
    mavenPublishing {
        coordinates('dev.quokkify.archgate', base.archivesName.get(), project.version.toString())
    }
}

publishing {
    repositories {
        maven {
            name = 'it'
            url = rootProject.layout.buildDirectory.dir('it-repo')
        }
    }
}
