plugins {
    id 'java-library'
    id 'checkstyle'
    id 'jacoco'
    id 'com.diffplug.spotless'
}

base.archivesName = "archgate-${project.name}"

def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Javadoc).configureEach {
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addBooleanOption('Werror', true)
}

repositories {
    mavenCentral()
}

// Temporary while the suite moves to TestNG (#23); removed once every project is migrated.
def TESTNG_PROJECTS = [
    ':api', ':core',
    ':context-archunit', ':rules-archunit', ':context-javaparser', ':rules-javaparser',
    ':context-classgraph', ':rules-classgraph',
    ':maven-plugin', ':gradle-plugin'
] as Set
def testng = TESTNG_PROJECTS.contains(path)

dependencies {
    if (testng) {
        testImplementation catalog.findLibrary('q4j-testng').get()
        testImplementation catalog.findLibrary('assertj-core').get()
    } else {
        testImplementation platform(catalog.findLibrary('junit-bom').get())
        testImplementation catalog.findLibrary('junit-jupiter').get()
        testImplementation catalog.findLibrary('assertj-core').get()
        testRuntimeOnly catalog.findLibrary('junit-platform-launcher').get()
    }
}

sourceSets.test.resources.srcDir rootProject.file('config/test-resources')
sourceSets.test.java.srcDir rootProject.file('config/test-support/java')

tasks.withType(Test).configureEach {
    if (testng) {
        useTestNG()
    } else {
        useJUnitPlatform()
    }
}

spotless {
    java {
        // The shared test-support sources live outside the project directory, which Spotless rejects.
        target 'src/**/*.java'
        palantirJavaFormat(catalog.findVersion('palantirJavaFormat').get().requiredVersion)
        removeUnusedImports()
    }
}

// Every project's clean closes Spotless's shared formatter class loaders, even while another
// project's Spotless task still uses them (diffplug/spotless#3067), so format only after all cleans.
// Remove once diffplug/spotless#3067 is fixed.
tasks.withType(com.diffplug.gradle.spotless.SpotlessTask).configureEach {
    mustRunAfter(rootProject.allprojects.collect { it.tasks.named { name -> name == 'clean' } })
}

checkstyle {
    toolVersion = catalog.findVersion('checkstyle').get().requiredVersion
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

tasks.named('checkstyleTest') {
    exclude 'archfixtures/**'
}

jacoco {
    toolVersion = catalog.findVersion('jacoco').get().requiredVersion
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

if (path ==~ /:(api|core|context-.+|rules-.+)/) {
    tasks.named('check') {
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Archgate-Api-Version': ArchgateVersions.apiVersionStamp(project.version.toString()),
            'Implementation-Title': base.archivesName.get(),
            'Implementation-Version': project.version.toString()
        )
    }
}

if (path ==~ /:rules-.+/) {
    tasks.named('test', Test) {
        dependsOn tasks.named('jar')
        systemProperty 'archgate.rulesJar', tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath
    }
}
