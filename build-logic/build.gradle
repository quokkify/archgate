plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    implementation libs.spotless.plugin
    implementation libs.vanniktech.publish.plugin
    implementation libs.plugin.publish.plugin
    implementation libs.maven.plugin.development.plugin

    testImplementation libs.q4j.testng
    testImplementation libs.assertj.core
}

tasks.withType(Test).configureEach {
    useTestNG()
    systemProperty 'allure.results.directory', layout.buildDirectory.dir('allure-results').get().asFile.path
}
