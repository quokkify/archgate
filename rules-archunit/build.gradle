plugins {
    id 'archgate.java-conventions'
    id 'archgate.publish-conventions'
}

dependencies {
    api project(':context-archunit')

    testImplementation project(':core')
    testImplementation libs.querydsl.core
    testImplementation libs.awaitility
    testImplementation libs.log4j.api
    testImplementation libs.testng
    testImplementation libs.slf4j.api
    testRuntimeOnly libs.slf4j.simple
}

tasks.named('test', Test) {
    dependsOn tasks.named('jar')
    systemProperty 'archgate.rulesJar', tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath
}

tasks.named('checkstyleTest') {
    exclude 'archfixtures/**'
}
