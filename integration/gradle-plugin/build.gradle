plugins {
    id 'java-gradle-plugin'
    id 'archgate.java-conventions'
    id 'archgate.publish-conventions'
    id 'com.gradle.plugin-publish'
}

description = 'Runs ArchGate architecture checks in a Gradle build.'

dependencies {
    implementation project(':core')
}

gradlePlugin {
    website = 'https://github.com/quokkify/archgate'
    vcsUrl = 'https://github.com/quokkify/archgate'
    plugins {
        archgate {
            id = 'dev.quokkify.archgate'
            implementationClass = 'dev.quokkify.archgate.gradle.ArchgatePlugin'
            displayName = 'ArchGate'
            description = 'Runs ArchGate architecture rules against the classes and sources of a Java project.'
            tags = ['architecture', 'archunit', 'quality']
        }
    }
}

// gradleApi() already ships an SLF4J provider; a second one makes SLF4J warn on every test run.
configurations.testRuntimeClasspath {
    exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
}
